# Opens the iOS app in an iPhone and an iPad simulator on one of GitHub's Macs, taps through the main flows
# (scripts/simulator-check.py) and keeps the screenshots as the run's "simulator-screenshots" artifact.
# The same screenshots (smaller) are force-pushed to the simulator-screenshots branch, so they can be fetched with git.
# Runs on pushes to iphone-* branches and by hand: GitHub → Actions → Simulator check → Run workflow.
name: Simulator check

on:
  workflow_dispatch:
  push:
    branches: ['iphone-*']

permissions:
  contents: write # only to push the screenshots to the simulator-screenshots branch

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Rust for the simulator
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-ios-sim

      - run: npm ci

      - name: Build for the simulator
        run: npx tauri ios build --debug --target aarch64-sim

      - name: idb (real taps in the simulator)
        continue-on-error: true # without it the check still takes the launch screenshots
        run: |
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pipx install fb-idb || pip3 install --break-system-packages fb-idb

      - name: Tap through and take screenshots
        run: |
          APP=$(find src-tauri/gen/apple/build -name 'Timetable.app' -type d | grep -i sim | head -1)
          test -n "$APP" || APP=$(find src-tauri/gen/apple/build -name '*.app' -type d | head -1)
          echo "App: $APP"
          python3 scripts/simulator-check.py "$APP" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: screenshots

      - name: Screenshots to the simulator-screenshots branch
        if: always()
        run: |
          test -d screenshots || exit 0
          mkdir -p /tmp/shots && cp screenshots/* /tmp/shots/
          for f in /tmp/shots/*.png; do sips -Z 1100 "$f" >/dev/null; done
          cd /tmp/shots
          git init -q -b simulator-screenshots
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q --allow-empty -m "Simulator screenshots for ${GITHUB_SHA::7}"
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Simulator screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" simulator-screenshots
