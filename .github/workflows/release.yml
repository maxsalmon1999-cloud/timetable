# Ships an update to her app from one of GitHub's Macs: the same `npm run release` Max runs locally
# (bump version, universal build, sign, commit + tag on main, GitHub release with latest.json).
#
# Run it: GitHub → Actions → Release → Run workflow, or change .github/release-request on main (how a Claude session
# releases: it can push, but not press Run workflow). That file's `bump:` and `notes:` lines are the inputs.
# Needs repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY   the contents of ~/.tauri/timetable.key (signs updates)
#   APPLE_CERTIFICATE           base64 of the Developer ID Application certificate exported as .p12
#   APPLE_CERTIFICATE_PASSWORD  that .p12's password
#   APPLE_ID, APPLE_PASSWORD    Max's Apple ID and an app-specific password (notarisation)
#   APPLE_TEAM_ID               DR6GPTU9UX
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor, major, or an exact version like 1.0.0'
        required: true
        default: patch
      notes:
        description: 'Release notes (optional)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['.github/release-request']

permissions:
  contents: write

# never two releases at once
concurrency: release

jobs:
  release:
    runs-on: macos-latest
    # Apple's notarisation usually takes minutes but has taken over 50; give it room (a cancelled run publishes nothing)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Rust with Intel + Apple Silicon targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - run: npm ci

      - name: Build, sign and publish
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Tauri imports the certificate into a temporary keychain, signs with it, then notarises and staples
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
          # inputs go through env, never pasted into the script, so notes can contain anything
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ inputs.notes }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            BUMP=$(sed -n 's/^bump: *//p' .github/release-request | head -1)
            NOTES=$(sed -n 's/^notes: *//p' .github/release-request | head -1)
          fi
          echo "Releasing: ${BUMP:-patch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs "${BUMP:-patch}" "$NOTES"
