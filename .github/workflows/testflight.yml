# Builds the iPad app on one of GitHub's Macs and uploads it to TestFlight, where her iPad picks it up.
#
# Runs after every successful Mac Release (same code, same version), once a month so her TestFlight build never
# reaches its 90-day expiry, and by hand: GitHub → Actions → TestFlight → Run workflow.
#
# Needs repository secrets (scripts/setup-testflight-secrets.sh puts them there):
#   APP_STORE_CONNECT_KEY_ID      the API key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID   the Issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY_P8      the contents of the downloaded AuthKey_<id>.p8
# Signing is automatic: Xcode uses the API key to fetch the distribution certificate and profile for team DR6GPTU9UX.
name: TestFlight

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '0 9 1 * *' # 09:00 UTC on the 1st of each month

permissions:
  contents: read

concurrency: testflight

jobs:
  ipad:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # includes the Release commit, so the version matches the Mac app

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Rust for iPad
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-ios

      - run: npm ci

      - name: API key for App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build and sign for the App Store
        env:
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # every upload needs a higher build number than the last; the run number always grows
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npx tauri ios build --export-method app-store-connect --build-number "$BUILD_NUMBER"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "No .ipa was built"; exit 1; }
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
